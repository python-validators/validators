# Python Code Quality Analysis
name: pycqa
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      # checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7
      # set up uv and a specific python version
      - name: Set up uv with Python v3.11
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true
      # tooling
      - name: Install 'tooling' dependencies
        run: uv sync --locked --group tooling --extra crypto-eth-addresses
      - name: Tooling
        run: |
          uv run --no-sync ruff format .
          uv run --no-sync ruff check .
          uv run --no-sync pyright .
  testing:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      # checkout repository again!
      # ref: https://github.com/actions/checkout/issues/19
      - name: Checkout repository
        uses: actions/checkout@v7
      # set up uv and a specific python version
      - name: Set up uv with Python v${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # testing
      - name: Install 'testing' dependencies
        run: uv sync --locked --no-editable --group testing --extra crypto-eth-addresses
      - name: Testing
        run: uv run --no-sync pytest .
